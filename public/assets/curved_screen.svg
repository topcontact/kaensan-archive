<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">
  <defs>
    <radialGradient id="screenGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85" />
      <stop offset="35%" stop-color="#aaaaaa" stop-opacity="0.4" />
      <stop offset="70%" stop-color="#222222" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#050505" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="floorGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0a0a" />
      <stop offset="20%" stop-color="#181818" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="#030303" />
  <!-- Gallery floor reflection -->
  <polygon points="0,550 1200,550 1200,900 0,900" fill="url(#floorGrad)" />
  <!-- Curved Screen Structure -->
  <path d="M 120,480 Q 600,520 1080,480 L 1080,180 Q 600,220 120,180 Z" fill="#0e0e0e" stroke="#333333" stroke-width="2" />
  <!-- Screen Projected Content Monochrome Gradient -->
  <path d="M 130,470 Q 600,510 1070,470 L 1070,190 Q 600,230 130,190 Z" fill="url(#screenGlow)" />
  <!-- Abstract visual installation lines on screen -->
  <line x1="300" y1="230" x2="300" y2="470" stroke="#ffffff" stroke-width="4" opacity="0.7" />
  <line x1="320" y1="235" x2="320" y2="465" stroke="#ffffff" stroke-width="1" opacity="0.5" />
  <line x1="600" y1="240" x2="600" y2="480" stroke="#ffffff" stroke-width="8" opacity="0.9" />
  <line x1="880" y1="235" x2="880" y2="465" stroke="#ffffff" stroke-width="2" opacity="0.6" />
  <!-- Museum Silhouettes -->
  <ellipse cx="600" cy="620" rx="180" ry="12" fill="#ffffff" opacity="0.08" />
  <circle cx="580" cy="580" r="16" fill="#000000" />
  <path d="M 565,600 L 595,600 L 590,680 L 570,680 Z" fill="#000000" />
  <circle cx="630" cy="575" r="15" fill="#000000" />
  <path d="M 616,595 L 644,595 L 640,675 L 620,675 Z" fill="#000000" />
</svg>