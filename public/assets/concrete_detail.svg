<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">
  <defs>
    <filter id="noise" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="4" result="noise" />
      <feColorMatrix type="matrix" values="0.33 0.33 0.33 0 0  0.33 0.33 0.33 0 0  0.33 0.33 0.33 0 0  0 0 0 1 0" />
      <feComponentTransfer>
        <feFuncR type="linear" slope="0.35" intercept="0.1"/>
        <feFuncG type="linear" slope="0.35" intercept="0.1"/>
        <feFuncB type="linear" slope="0.35" intercept="0.1"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="noise" mode="multiply" />
    </filter>
    <linearGradient id="shadowGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2a2a2a" />
      <stop offset="40%" stop-color="#141414" />
      <stop offset="100%" stop-color="#040404" />
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#shadowGrad)" />
  <!-- Concrete board joints -->
  <line x1="0" y1="300" x2="1200" y2="300" stroke="#000000" stroke-width="6" opacity="0.9" />
  <line x1="0" y1="302" x2="1200" y2="302" stroke="#444444" stroke-width="1" opacity="0.6" />
  <line x1="0" y1="600" x2="1200" y2="600" stroke="#000000" stroke-width="6" opacity="0.9" />
  <line x1="0" y1="602" x2="1200" y2="602" stroke="#444444" stroke-width="1" opacity="0.6" />
  <!-- Tie rod holes -->
  <circle cx="200" cy="150" r="14" fill="#050505" stroke="#333333" stroke-width="2" />
  <circle cx="200" cy="150" r="8" fill="#000000" />
  <circle cx="600" cy="150" r="14" fill="#050505" stroke="#333333" stroke-width="2" />
  <circle cx="600" cy="150" r="8" fill="#000000" />
  <circle cx="1000" cy="150" r="14" fill="#050505" stroke="#333333" stroke-width="2" />
  <circle cx="1000" cy="150" r="8" fill="#000000" />
  <circle cx="200" cy="450" r="14" fill="#050505" stroke="#333333" stroke-width="2" />
  <circle cx="200" cy="450" r="8" fill="#000000" />
  <circle cx="600" cy="450" r="14" fill="#050505" stroke="#333333" stroke-width="2" />
  <circle cx="600" cy="450" r="8" fill="#000000" />
  <circle cx="1000" cy="450" r="14" fill="#050505" stroke="#333333" stroke-width="2" />
  <circle cx="1000" cy="450" r="8" fill="#000000" />
  <circle cx="200" cy="750" r="14" fill="#050505" stroke="#333333" stroke-width="2" />
  <circle cx="200" cy="750" r="8" fill="#000000" />
  <circle cx="600" cy="750" r="14" fill="#050505" stroke="#333333" stroke-width="2" />
  <circle cx="600" cy="750" r="8" fill="#000000" />
  <circle cx="1000" cy="750" r="14" fill="#050505" stroke="#333333" stroke-width="2" />
  <circle cx="1000" cy="750" r="8" fill="#000000" />
  <!-- Raking brutalist light slash -->
  <polygon points="0,0 750,0 350,900 0,900" fill="#ffffff" opacity="0.04" />
  <polygon points="200,0 600,0 250,900 0,900" fill="#ffffff" opacity="0.03" />
</svg>